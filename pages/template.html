<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarePulse | Page Template</title>

    <link rel="stylesheet" href="../assets/css/template.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    
</head>
<body class="care-page">
        <!-- ============ SIDEBAR ============ -->
<aside class="sidebar">
  <a href="calendar.html" class="sidebar-logo">
    <img src="../assets/CAREPULSE LOGO.png" alt="CarePulse logo">
    <div>
      <span class="logo-title">CarePulse</span>
      <span class="logo-sub">Clinical Card</span>
    </div>
  </a>

  <a href="profile.html" class="user-card">
    <div class="user-avatar" id="userInitial">–</div>
    <div class="user-meta">
      <span class="user-name" id="userName">—</span>
      <span class="user-role" id="userRole">—</span>
    </div>
    <span class="user-chevron">›</span>
  </a>

  <button class="btn-flare" type="button">
    <span aria-hidden="true">⚠</span> Log Acute Flare
  </button>

  <nav class="sidebar-nav" aria-label="Main navigation">
    <a href="dailylog.html"   class="nav-item"><span>📝</span> Daily Logger</a>
    <a href="calendar.html"   class="nav-item"><span>📅</span> Calendar &amp; Tasks</a>
    <a href="analytics.html"  class="nav-item"><span>📈</span> Analytics &amp; Trends</a>
    <a href="docreport.html"  class="nav-item"><span>📄</span> Doctor Report</a>
    <a href="datapriv.html"   class="nav-item"><span>🔒</span> Data &amp; Privacy</a>
    <a href="profile.html"    class="nav-item"><span>⚙️</span> Profile Setup</a>
  </nav>

  <div class="local-mode">
    <div class="local-mode-label"><span class="dot"></span> Local Care Mode</div>
    <p id="localModeText">Recording locally</p>
  </div>
</aside>

  <!-- ============ TOPBAR ============ -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="status-pill"><span class="dot"></span> Active Monitoring</span>
      <span class="topbar-divider"></span>
      <span class="next-appt" id="nextAppt">No appointment set</span>
    </div>
    <div class="topbar-right">
      <div class="topbar-meta">
        <span id="topRole">—</span>
        <span class="topbar-sub" id="topMode">Mode</span>
      </div>
      <div class="topbar-avatar" id="topInitial">–</div>
      <button class="btn-logout" id="logoutBtn" type="button">
        <span>⏻</span> Logout
      </button>
    </div>
  </header>

<main class="content">
  <!-- Add page content here. -->
</main>

<script src="../assets/js/template.js"></script>

</body>
</html>
